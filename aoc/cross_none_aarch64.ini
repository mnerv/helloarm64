[binaries]
c = 'aarch64-none-linux-gnu-gcc'
cpp = 'aarch64-none-linux-gnu-g++'
ar = 'aarch64-none-linux-gnu-ar'
as = 'aarch64-none-linux-gnu-as'
ld = 'aarch64-none-linux-gnu-ld'
strip = 'aarch64-none-linux-gnu-strip'

[properties]
as_args = ['--march=armv8-a']   # Assembler arguments
ld_args = ['-static']           # Linker arguments

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

